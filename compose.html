<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compose</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="topbar.css">
  <style>
    :root{
      --bg:#eef1f6;--surface:#fff;--surface-2:#f7f8fb;--border:#e5e8f0;--border-strong:#d3d8e4;
      --text:#1f2430;--text-muted:#6b7280;--accent:#4f46e5;--accent-hover:#4338ca;
      --success:#16a34a;--danger:#dc2626;
      --radius:14px;--radius-xs:8px;
      --shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 6px 18px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}

    .wrap{display:grid;grid-template-columns:260px 1fr 300px;gap:16px;max-width:1400px;margin:0 auto;padding:16px 24px 60px;align-items:start}
    @media(max-width:1100px){.wrap{grid-template-columns:1fr}}

    .col{display:flex;flex-direction:column;gap:14px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px}
    .panel h3{margin:0 0 10px;font-size:.95rem;font-weight:700}
    .muted{color:var(--text-muted);font-size:.82rem}

    /* Asset picker */
    #asset-search{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);font-size:.88rem;outline:none;margin-bottom:6px}
    #asset-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
    .asset-list{max-height:calc(100vh - 260px);overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-xs)}
    .asset-item{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:grab;border-bottom:1px solid var(--border);user-select:none}
    .asset-item:last-child{border-bottom:none}
    .asset-item:hover{background:var(--surface-2)}
    .asset-item.dragging-src{opacity:.4}
    .asset-item img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated;background:#f3f4f8;border-radius:3px;flex:none;pointer-events:none}
    .ai-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .list-empty{padding:12px;text-align:center;color:var(--text-muted);font-size:.83rem}

    /* Stage */
    .stage{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:500px}
    .size-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
    .size-bar label{font-size:.82rem;font-weight:700;color:var(--text-muted)}
    .size-input{width:72px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);font-size:.88rem;text-align:center}
    .size-input:focus{outline:none;border-color:var(--accent)}
    .canvas-wrap{
      position:relative;display:inline-block;
      border:1px solid var(--border-strong);border-radius:6px;
      box-shadow:var(--shadow-md);
      background-color:#fff;
      background-image:linear-gradient(45deg,#e9ecf3 25%,transparent 25%),linear-gradient(-45deg,#e9ecf3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9ecf3 75%),linear-gradient(-45deg,transparent 75%,#e9ecf3 75%);
      background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;
      overflow:hidden;
    }
    .canvas-wrap.dragover{outline:3px dashed var(--accent);outline-offset:2px}
    canvas#view{display:block;image-rendering:pixelated;cursor:default}
    canvas#view.can-grab{cursor:grab}
    canvas#view.grabbing{cursor:grabbing}
    .stage-hint{color:var(--text-muted);font-size:.82rem;pointer-events:none}

    /* Buttons */
    .btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-xs);padding:7px 12px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text);transition:background .13s,border-color .13s}
    .btn:hover{background:var(--surface-2);border-color:var(--accent)}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.primary:hover{background:var(--accent-hover)}
    .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-row{display:flex;gap:6px;flex-wrap:wrap}

    /* Layers panel */
    .layer-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
    .layer-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--surface-2);user-select:none}
    .layer-item:hover{border-color:var(--accent)}
    .layer-item.selected{border-color:var(--accent);background:#eef2ff}
    .layer-item img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;background:#f3f4f8;border-radius:3px;flex:none}
    .layer-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
    .layer-actions{display:flex;gap:2px;flex:none}
    .lbtn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:.72rem;display:flex;align-items:center;justify-content:center;padding:0;color:var(--text-muted)}
    .lbtn:hover{background:var(--surface-2);border-color:var(--accent);color:var(--text)}
    .lbtn.del{color:var(--danger)}
    .lbtn.del:hover{background:#fef2f2;border-color:var(--danger)}
    .no-layers{padding:8px;text-align:center;color:var(--text-muted);font-size:.82rem}

    /* Metadata form */
    .form-field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
    .form-field label{font-size:.78rem;font-weight:700;color:var(--text-muted)}
    .form-field input,.form-field select,.form-field textarea{
      padding:6px 9px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);
      font-size:.85rem;font-family:inherit;outline:none;background:var(--surface)
    }
    .form-field input:focus,.form-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

    hr.div{border:none;border-top:1px solid var(--border);margin:8px 0}
    /* Tag / category autocomplete */
    .ac-wrap{position:relative}
    .suggestions{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-xs);box-shadow:var(--shadow-md);z-index:200;max-height:140px;overflow-y:auto;display:none}
    .suggestions.open{display:block}
    .suggestion-item{padding:6px 10px;cursor:pointer;font-size:.83rem}
    .suggestion-item:hover,.suggestion-item.active{background:var(--surface-2)}
    /* Color select (same component as index/app.css) */
    .color-swatch.none{background:#fff!important;background-image:linear-gradient(135deg,transparent 44%,var(--danger) 44%,var(--danger) 56%,transparent 56%)!important}
    .custom-color-select{position:relative;cursor:pointer}
    .selected-color-display{display:flex;align-items:center;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--surface);transition:border-color .15s}
    .selected-color-display:hover{border-color:var(--accent)}
    .custom-color-select[aria-expanded="true"] .selected-color-display{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
    .color-swatch{flex:none;width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.22);margin-right:8px;background-clip:padding-box}
    .color-name{flex-grow:1;font-size:.88rem;text-transform:capitalize}
    .color-hex{color:var(--text-muted);font-size:.75rem;margin-left:4px;font-variant-numeric:tabular-nums}
    .dropdown-arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--text-muted);margin-left:6px}
    .color-options-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:300;background:var(--surface);border:1px solid var(--border-strong);max-height:240px;overflow-y:auto;border-radius:var(--radius-xs);box-shadow:var(--shadow-md);display:none;padding:4px}
    .color-options-list[aria-hidden="false"]{display:block}
    .color-option{display:flex;align-items:center;padding:6px 8px;gap:8px;border-radius:6px;cursor:pointer}
    .color-option:hover{background:var(--surface-2)}
    .color-option .color-swatch{margin-right:0}
    .color-option .co-name{flex:1;text-transform:capitalize;font-size:.85rem}

    label.check{display:flex;align-items:center;gap:7px;font-size:.84rem;font-weight:600;cursor:pointer}
    label.check input{accent-color:var(--accent)}
  </style>
</head>
<body>

<header class="app-topbar">
  <div class="topbar-left">
    <h1 class="app-title">Asset Manager</h1>
    <nav class="app-nav">
      <a href="/" class="nav-link">Index</a>
      <a href="/collections" class="nav-link">Collections</a>
      <a href="/add-assets" class="nav-link">Add Assets</a>
      <a href="/compose" class="nav-link" aria-current="page">Compose</a>
      <a href="/align" class="nav-link">Sprite</a>
      <a href="/collisions" class="nav-link">Collisions</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <!-- Left: asset picker -->
  <div class="panel">
    <h3>Assets</h3>
    <input id="asset-search" type="text" placeholder="Search by name…"/>
    <div id="asset-list" class="asset-list"><div class="list-empty">Loading…</div></div>
  </div>

  <!-- Center: canvas stage -->
  <div class="panel stage">
    <div class="size-bar">
      <label>W</label>
      <input class="size-input" id="inp-w" type="number" value="320" min="32" step="32"/>
      <label>H</label>
      <input class="size-input" id="inp-h" type="number" value="320" min="32" step="32"/>
      <button class="btn" id="btn-resize">Apply</button>
      <label class="check" style="margin-left:4px"><input type="checkbox" id="snap-grid" checked> Snap to 32px grid</label>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="view"></canvas>
    </div>
    <span class="stage-hint" id="stage-hint">Drag assets from the left panel onto the canvas.</span>
  </div>

  <!-- Right: layers + metadata -->
  <div class="col">

    <div class="panel">
      <h3>Layers <span class="muted" id="layer-count">(0)</span></h3>
      <div id="layer-list" class="layer-list"><div class="no-layers">No layers yet.</div></div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn" id="btn-clear-layers" disabled>Clear all</button>
        <button class="btn" id="btn-flatten" disabled>Flatten order</button>
      </div>
    </div>

    <div class="panel">
      <h3>Composition info</h3>

      <div class="form-field">
        <label>Name *</label>
        <input type="text" id="meta-name" placeholder="My composition"/>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Category</label>
          <div class="ac-wrap">
            <input type="text" id="meta-category" placeholder="e.g. furniture" autocomplete="off"/>
            <div id="cat-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div class="form-field">
          <label>Direction</label>
          <select id="meta-direction">
            <option value="">— none —</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
            <option value="forward">Forward</option>
            <option value="backward">Backward</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label>Tags <span class="muted">(comma-separated)</span></label>
        <div class="ac-wrap">
          <input type="text" id="meta-tags" placeholder="office, wood, large" autocomplete="off"/>
          <div id="tag-suggestions" class="suggestions"></div>
        </div>
      </div>

      <div class="form-field">
        <label>Primary color</label>
        <div class="custom-color-select" id="color1-root" aria-haspopup="listbox" aria-expanded="false">
          <div class="selected-color-display" tabindex="0">
            <div class="color-swatch"></div><span class="color-name">Leave unchanged</span><span class="color-hex"></span><div class="dropdown-arrow"></div>
          </div>
          <div class="color-options-list" role="listbox" aria-hidden="true"></div>
        </div>
      </div>
      <div class="form-field">
        <label>Secondary color</label>
        <div class="custom-color-select" id="color2-root" aria-haspopup="listbox" aria-expanded="false">
          <div class="selected-color-display" tabindex="0">
            <div class="color-swatch"></div><span class="color-name">Leave unchanged</span><span class="color-hex"></span><div class="dropdown-arrow"></div>
          </div>
          <div class="color-options-list" role="listbox" aria-hidden="true"></div>
        </div>
      </div>

      <div id="edit-banner" style="display:none;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:7px 10px;font-size:.82rem;color:#4f46e5;font-weight:600;margin-bottom:4px"></div>
      <div class="btn-row" style="margin-top:4px">
        <button class="btn danger" id="btn-delete" style="display:none">Delete</button>
        <button class="btn primary" id="btn-save" disabled>Save composition</button>
      </div>
    </div>

  </div>
</div>

<script src="dialog.js"></script>
<script>
  const API_URL = 'http://localhost:8000';
  const STEP = 32;
  const $ = s => document.querySelector(s);

  // ── State ──────────────────────────────────────────────────────────────────
  let canvasW = 320, canvasH = 320;
  let scale = 1;
  let layers = [];          // [{id, img, imagePath, name, x, y}]
  let selectedId = null;
  let collection = [];
  let allCategories = [], allTags = [];
  let editingId = null;     // set when editing an existing composition

  // Drag-on-canvas state
  let dragging = false, dragLayerId = null;
  let dragOffX = 0, dragOffY = 0;

  const view      = $('#view');
  const ctx       = view.getContext('2d');
  const wrapEl    = $('#canvas-wrap');
  const listEl    = $('#asset-list');
  const searchEl  = $('#asset-search');
  const layerListEl = $('#layer-list');
  const hintEl    = $('#stage-hint');

  // ── Canvas size ────────────────────────────────────────────────────────────
  function snap32(v){ return Math.max(STEP, Math.round(v/STEP)*STEP); }

  function applySize(){
    const w = snap32(Number($('#inp-w').value)||320);
    const h = snap32(Number($('#inp-h').value)||320);
    $('#inp-w').value = w; $('#inp-h').value = h;
    canvasW = w; canvasH = h;
    resizeCanvas();
    render();
  }

  function resizeCanvas(){
    const maxVis = 560;
    scale = Math.max(1, Math.min(Math.floor(Math.min(maxVis/canvasW, maxVis/canvasH)), 8));
    view.width  = canvasW * scale;
    view.height = canvasH * scale;
    view.style.width  = (canvasW * scale) + 'px';
    view.style.height = (canvasH * scale) + 'px';
  }

  $('#btn-resize').addEventListener('click', applySize);
  ['#inp-w','#inp-h'].forEach(sel=>$(sel).addEventListener('keydown', e=>{ if(e.key==='Enter') applySize(); }));

  // Snap values while typing
  ['#inp-w','#inp-h'].forEach(sel=>$(sel).addEventListener('change', ()=>{
    const el=$(sel);
    el.value = snap32(Number(el.value)||STEP);
  }));

  // ── Render ─────────────────────────────────────────────────────────────────
  function render(){
    ctx.clearRect(0, 0, view.width, view.height);
    ctx.imageSmoothingEnabled = false;

    // Layers (bottom to top)
    for (const l of layers){
      ctx.drawImage(l.img, 0, 0, l.img.naturalWidth, l.img.naturalHeight,
        l.x*scale, l.y*scale, l.img.naturalWidth*scale, l.img.naturalHeight*scale);
    }

    // Selection highlight
    if (selectedId !== null){
      const sel = layers.find(l=>l.id===selectedId);
      if (sel){
        ctx.save();
        ctx.strokeStyle='rgba(79,70,229,.9)';
        ctx.lineWidth=Math.max(1,scale/2);
        ctx.setLineDash([3*scale,2*scale]);
        ctx.strokeRect(sel.x*scale+.5, sel.y*scale+.5, sel.img.naturalWidth*scale-1, sel.img.naturalHeight*scale-1);
        ctx.restore();
      }
    }

    // 32px grid
    ctx.save();
    ctx.strokeStyle='rgba(17,24,39,.2)'; ctx.lineWidth=1;
    const step=STEP*scale;
    for (let x=step; x<view.width; x+=step){ const px=Math.round(x)+.5; ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,view.height);ctx.stroke(); }
    for (let y=step; y<view.height; y+=step){ const py=Math.round(y)+.5; ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(view.width,py);ctx.stroke(); }
    ctx.restore();

    // Border
    ctx.strokeStyle='rgba(79,70,229,.3)'; ctx.lineWidth=1;
    ctx.strokeRect(.5,.5,view.width-1,view.height-1);

    hintEl.hidden = layers.length > 0;
  }

  // ── Collection loading ─────────────────────────────────────────────────────
  async function loadCollection(){
    listEl.innerHTML='<div class="list-empty">Loading…</div>';
    let compositions = [];
    try{
      const r = await fetch(`assets_list.json?t=${Date.now()}`);
      const d = await r.json();
      collection = Array.isArray(d.collection) ? d.collection : [];
      compositions = Array.isArray(d.compositions) ? d.compositions : [];
    }catch{ collection=[]; }
    // Build autocomplete sets
    allCategories = [...new Set(collection.map(a=>a.category).filter(Boolean))].sort();
    const tagSet = new Set();
    collection.forEach(a=>Array.isArray(a.tags)&&a.tags.forEach(t=>t&&tagSet.add(t)));
    allTags = [...tagSet].sort();
    renderPicker();

    // Edit mode: load composition from ?id= param
    const editId = new URLSearchParams(location.search).get('id');
    if (editId){
      const comp = compositions.find(c=>c.id === editId);
      if (comp) await loadCompositionForEdit(comp);
      else await Dialog.alert('Composition not found.', {type:'error'});
    }
  }

  async function loadCompositionForEdit(comp){
    editingId = comp.id;

    // Banner + button label
    $('#edit-banner').style.display = '';
    $('#edit-banner').textContent = `Editing: ${comp.name}`;
    $('#btn-save').textContent = 'Update composition';
    $('#btn-delete').style.display = '';

    // Canvas size
    canvasW = comp.canvasWidth || 320;
    canvasH = comp.canvasHeight || 320;
    $('#inp-w').value = canvasW;
    $('#inp-h').value = canvasH;
    resizeCanvas();

    // Metadata
    $('#meta-name').value = comp.name || '';
    $('#meta-category').value = comp.category || '';
    $('#meta-direction').value = comp.direction || '';
    $('#meta-tags').value = (comp.tags || []).join(', ');
    if (comp.color) colorSel1.setValue(comp.color);
    if (comp.secondaryColor) colorSel2.setValue(comp.secondaryColor);

    // Load layers
    const byId = new Map(collection.filter(a=>a.id).map(a=>[a.id,a]));
    for (const layer of (comp.layers||[])){
      const asset = byId.get(layer.assetId);
      if (!asset?.imagePath) continue;
      await new Promise(resolve=>{
        const img = new Image();
        img.onload = ()=>{
          layers.push({id: Date.now()+Math.random(), assetId: layer.assetId, img, imagePath: asset.imagePath, name: asset.name||asset.imagePath.split('/').pop(), x: layer.x, y: layer.y});
          resolve();
        };
        img.onerror = resolve;
        img.src = asset.imagePath;
      });
    }
    selectedId = layers.length ? layers[layers.length-1].id : null;
    refreshLayerPanel();
    render();
    updateButtons();
  }

  function renderPicker(){
    const q=(searchEl.value||'').toLowerCase();
    const items=collection.filter(a=>a&&a.imagePath&&(!q||(a.name||'').toLowerCase().includes(q)));
    if (!items.length){listEl.innerHTML='<div class="list-empty">No asset found.</div>';return;}
    listEl.innerHTML='';
    for (const a of items){
      const el=document.createElement('div');
      el.className='asset-item';
      el.draggable=true;
      el.dataset.path=a.imagePath;
      el.dataset.assetId=a.id||'';
      el.dataset.name=a.name||a.imagePath.split('/').pop();
      el.innerHTML=`<img src="${a.imagePath}" loading="lazy" alt=""><span class="ai-name">${el.dataset.name}</span>`;
      el.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('asset/path', a.imagePath);
        e.dataTransfer.setData('asset/id', a.id||'');
        e.dataTransfer.setData('asset/name', el.dataset.name);
        e.dataTransfer.effectAllowed='copy';
        el.classList.add('dragging-src');
      });
      el.addEventListener('dragend', ()=>el.classList.remove('dragging-src'));
      listEl.appendChild(el);
    }
  }
  searchEl.addEventListener('input', renderPicker);

  // ── Drop onto canvas ───────────────────────────────────────────────────────
  wrapEl.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; wrapEl.classList.add('dragover'); });
  wrapEl.addEventListener('dragleave', ()=>wrapEl.classList.remove('dragover'));
  wrapEl.addEventListener('drop', e=>{
    e.preventDefault(); wrapEl.classList.remove('dragover');
    const path=e.dataTransfer.getData('asset/path');
    const assetId=e.dataTransfer.getData('asset/id');
    const name=e.dataTransfer.getData('asset/name');
    if (!path) return;
    const rect=wrapEl.getBoundingClientRect();
    const dropX=(e.clientX-rect.left)/scale;
    const dropY=(e.clientY-rect.top)/scale;
    loadAssetToCanvas(path, assetId, name, dropX, dropY);
  });

  function loadAssetToCanvas(path, assetId, name, dropX, dropY){
    const img=new Image();
    img.onload=()=>{
      let x=Math.round(dropX - img.naturalWidth/2);
      let y=Math.round(dropY - img.naturalHeight/2);
      if ($('#snap-grid').checked){
        x=Math.round(x/STEP)*STEP;
        y=Math.round(y/STEP)*STEP;
      }
      const id=Date.now()+Math.random();
      layers.push({id, assetId, img, imagePath:path, name, x, y});
      selectedId=id;
      refreshLayerPanel();
      render();
      updateButtons();
    };
    img.onerror=()=>Dialog.alert(`Could not load: ${path}`,{type:'error'});
    img.src=`${path}?t=${Date.now()}`;
  }

  // ── Layer panel ────────────────────────────────────────────────────────────
  function refreshLayerPanel(){
    $('#layer-count').textContent=`(${layers.length})`;
    $('#btn-clear-layers').disabled=layers.length===0;
    $('#btn-flatten').disabled=layers.length===0;

    if (!layers.length){
      layerListEl.innerHTML='<div class="no-layers">No layers yet.</div>';
      return;
    }
    layerListEl.innerHTML='';
    // Show top layer first
    for (let i=layers.length-1;i>=0;i--){
      const l=layers[i];
      const el=document.createElement('div');
      el.className='layer-item'+(l.id===selectedId?' selected':'');
      el.dataset.id=l.id;
      el.innerHTML=`
        <img src="${l.imagePath}" alt="">
        <span class="layer-name" title="${l.name}">${l.name}</span>
        <div class="layer-actions">
          <button class="lbtn" data-act="up"   title="Move up">↑</button>
          <button class="lbtn" data-act="down" title="Move down">↓</button>
          <button class="lbtn del" data-act="del" title="Remove">×</button>
        </div>`;
      el.addEventListener('click', e=>{
        if (e.target.closest('.layer-actions')) return;
        selectedId=l.id; refreshLayerPanel(); render();
      });
      el.querySelectorAll('.lbtn').forEach(btn=>btn.addEventListener('click', e=>{
        e.stopPropagation();
        const act=btn.dataset.act;
        if (act==='del'){ layers.splice(i,1); if(selectedId===l.id)selectedId=layers.length?layers[layers.length-1].id:null; }
        else if (act==='up'  && i<layers.length-1){ [layers[i],layers[i+1]]=[layers[i+1],layers[i]]; }
        else if (act==='down'&& i>0)               { [layers[i],layers[i-1]]=[layers[i-1],layers[i]]; }
        refreshLayerPanel(); render(); updateButtons();
      }));
      layerListEl.appendChild(el);
    }
  }

  $('#btn-clear-layers').addEventListener('click', async ()=>{
    if (!await Dialog.confirm('Remove all layers?',{confirmLabel:'Clear',danger:true})) return;
    layers=[]; selectedId=null; refreshLayerPanel(); render(); updateButtons();
  });

  // Flatten = sort top-most layer = index last (visual order already is that)
  $('#btn-flatten').addEventListener('click', ()=>{ render(); Dialog.alert('Layer order is already the render order.',{type:'info'}); });

  // ── Canvas pointer interactions ────────────────────────────────────────────
  function canvasPos(e){
    const r=view.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }

  function hitTest(cx,cy){
    for (let i=layers.length-1;i>=0;i--){
      const l=layers[i];
      if (cx>=l.x&&cx<l.x+l.img.naturalWidth&&cy>=l.y&&cy<l.y+l.img.naturalHeight) return i;
    }
    return -1;
  }

  view.addEventListener('pointerdown', e=>{
    const {x,y}=canvasPos(e);
    const idx=hitTest(x,y);
    if (idx>=0){
      const l=layers[idx];
      selectedId=l.id;
      dragging=true; dragLayerId=l.id;
      dragOffX=x-l.x; dragOffY=y-l.y;
      view.setPointerCapture(e.pointerId);
      view.classList.add('grabbing');
      refreshLayerPanel(); render();
    } else {
      selectedId=null; refreshLayerPanel(); render();
    }
  });

  view.addEventListener('pointermove', e=>{
    if (!dragging) return;
    const {x,y}=canvasPos(e);
    const l=layers.find(l=>l.id===dragLayerId);
    if (!l) return;
    let nx=x-dragOffX, ny=y-dragOffY;
    if ($('#snap-grid').checked){ nx=Math.round(nx/STEP)*STEP; ny=Math.round(ny/STEP)*STEP; }
    l.x=nx; l.y=ny;
    render();
  });

  const endDrag=e=>{ if(!dragging)return; dragging=false; view.classList.remove('grabbing'); try{view.releasePointerCapture(e.pointerId);}catch{} };
  view.addEventListener('pointerup',endDrag);
  view.addEventListener('pointercancel',endDrag);

  // Cursor hint
  view.addEventListener('mousemove', e=>{
    if (dragging) return;
    const {x,y}=canvasPos(e);
    view.classList.toggle('can-grab', hitTest(x,y)>=0);
  });

  // ── Color select (same palette as index) ──────────────────────────────────
  const COLOR_FAMILIES = {
    red:"#FF0000",maroon:"#800000",crimson:"#DC143C",coral:"#FF7F50",
    blue:"#0000FF",navy:"#000080",teal:"#008080",cyan:"#00FFFF",
    light_blue:"#ADD8E6",yellow:"#FFFF00",gold:"#FFD700",green:"#00FF00",
    lime:"#00FF00",forest_green:"#228B22",olive:"#808000",brown:"#A52A2A",
    chocolate:"#D2691E",saddlebrown:"#8B4513",orange:"#FFA500",purple:"#800080",
    magenta:"#FF00FF",fuchsia:"#FF00FF",pink:"#FFC0CB",hot_pink:"#FF69B4",
    grey:"#808080",dark_grey:"#A9A9A9",light_grey:"#D3D3D3",black:"#000000",
    white:"#FFFFFF",beige:"#F5F5DC",tan:"#D2B48C"
  };
  const hexToRgb2 = h=>{ if(!h)return null; h=h.replace(/^#?([a-f\d])([a-f\d])([a-f\d])$/i,(_,r,g,b)=>r+r+g+g+b+b); const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null; };
  const hexToHsl2 = h=>{ const c=hexToRgb2(h); if(!c)return[0,0,0]; const r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let hh=0,s=0,l=(mx+mn)/2; if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:hh=((g-b)/d+(g<b?6:0));break;case g:hh=(b-r)/d+2;break;default:hh=(r-g)/d+4;}hh/=6;} return[hh*360,s,l]; };
  const closestFam = hex=>{ const rgb=hexToRgb2(hex); if(!rgb)return''; let mn=Infinity,best=''; for(const[n,h]of Object.entries(COLOR_FAMILIES)){const c=hexToRgb2(h);if(!c)continue;const d=(rgb.r-c.r)**2+(rgb.g-c.g)**2+(rgb.b-c.b)**2;if(d<mn){mn=d;best=n;}}return best; };
  const COLOR_SORTED = Object.entries(COLOR_FAMILIES).sort((a,b)=>{
    const[ha,sa,la]=hexToHsl2(a[1]),[hb,sb,lb]=hexToHsl2(b[1]);
    const ga=sa<.12,gb=sb<.12; if(ga!==gb)return ga?1:-1; if(ga&&gb)return lb-la;
    if(Math.abs(ha-hb)>1)return ha-hb; return lb-la;
  });

  function createColorSelect(rootId){
    const root=$(rootId);
    const display=root.querySelector('.selected-color-display');
    const panel=root.querySelector('.color-options-list');
    const swatch=display.querySelector('.color-swatch');
    const nameEl=display.querySelector('.color-name');
    const hexEl=display.querySelector('.color-hex');
    let currentHex='';

    function setVal(hex, label, silent=false){
      swatch.style.background=hex||'transparent';
      nameEl.textContent=label||(hex?closestFam(hex):'No color');
      hexEl.textContent=hex||'';
      currentHex=hex||'';
      root.dataset.hex=currentHex;
    }
    function togglePanel(){
      const open=panel.getAttribute('aria-hidden')==='false';
      // close all other panels
      document.querySelectorAll('.color-options-list[aria-hidden="false"]').forEach(p=>{if(p!==panel)p.setAttribute('aria-hidden','true');p.closest('.custom-color-select')?.removeAttribute('aria-expanded');});
      panel.setAttribute('aria-hidden', open?'true':'false');
      root.setAttribute('aria-expanded', open?'false':'true');
    }

    // Build options
    const noOpt=document.createElement('div');
    noOpt.className='color-option'; noOpt.dataset.value='';
    noOpt.innerHTML=`<div class="color-swatch" style="background:transparent"></div><span class="co-name">No color</span>`;
    noOpt.addEventListener('click',e=>{e.stopPropagation();setVal('','No color');togglePanel();});
    panel.appendChild(noOpt);

    for(const[fam,hex]of COLOR_SORTED){
      const opt=document.createElement('div');
      opt.className='color-option'; opt.dataset.value=hex;
      opt.innerHTML=`<div class="color-swatch" style="background:${hex}"></div><span class="co-name">${fam}</span><span class="color-hex">${hex}</span>`;
      opt.addEventListener('click',e=>{e.stopPropagation();setVal(hex,fam);togglePanel();});
      panel.appendChild(opt);
    }

    display.addEventListener('click',e=>{e.stopPropagation();togglePanel();});
    display.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();togglePanel();}});

    return { getValue(){ return currentHex; }, reset(){ setVal('','No color'); }, setValue(hex){ const fam=hex?closestFam(hex):''; setVal(hex||'', fam||'No color'); } };
  }

  document.addEventListener('click',()=>{
    document.querySelectorAll('.color-options-list[aria-hidden="false"]').forEach(p=>{p.setAttribute('aria-hidden','true');p.closest('.custom-color-select')?.removeAttribute('aria-expanded');});
  });

  const colorSel1 = createColorSelect('#color1-root');
  const colorSel2 = createColorSelect('#color2-root');

  // ── Autocomplete helpers ───────────────────────────────────────────────────
  function makeAC(inputId, suggId, getMatches){
    const inp = $(inputId), box = $(suggId);
    let activeIdx = -1;

    function show(items){
      if (!items.length){ box.classList.remove('open'); return; }
      box.innerHTML = items.slice(0,10).map(t=>`<div class="suggestion-item">${t}</div>`).join('');
      activeIdx = -1;
      box.classList.add('open');
      box.querySelectorAll('.suggestion-item').forEach((el,i)=>{
        el.addEventListener('mousedown', e=>{
          e.preventDefault();
          pick(items[i]);
        });
      });
    }

    function pick(value){
      getMatches.onPick(value, inp);
      box.classList.remove('open');
      activeIdx = -1;
    }

    inp.addEventListener('focus', ()=> show(getMatches.filter(inp.value)));
    inp.addEventListener('click', ()=> show(getMatches.filter(inp.value)));
    inp.addEventListener('input', ()=> show(getMatches.filter(inp.value)));
    inp.addEventListener('keydown', e=>{
      const items = box.querySelectorAll('.suggestion-item');
      if (!items.length) return;
      if (e.key==='ArrowDown'){ e.preventDefault(); activeIdx=Math.min(activeIdx+1,items.length-1); }
      else if (e.key==='ArrowUp'){ e.preventDefault(); activeIdx=Math.max(activeIdx-1,0); }
      else if (e.key==='Enter'&&activeIdx>=0){ e.preventDefault(); items[activeIdx].dispatchEvent(new MouseEvent('mousedown')); return; }
      else if (e.key==='Escape'){ box.classList.remove('open'); return; }
      items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));
    });
    inp.addEventListener('blur', ()=>setTimeout(()=>box.classList.remove('open'),150));
  }

  // Category: simple single-value autocomplete
  makeAC('#meta-category','#cat-suggestions',{
    filter: v => allCategories.filter(c=>c.toLowerCase().startsWith(v.trim().toLowerCase()) && c!==v.trim()),
    onPick: (val, inp) => { inp.value = val; }
  });

  // Tags: token-aware autocomplete (complete last token after comma)
  makeAC('#meta-tags','#tag-suggestions',{
    filter: v => {
      const parts = v.split(',');
      const cur = parts[parts.length-1].trim().toLowerCase();
      if (!cur) return [];
      const used = parts.slice(0,-1).map(p=>p.trim().toLowerCase());
      return allTags.filter(t=>t.toLowerCase().startsWith(cur)&&!used.includes(t.toLowerCase()));
    },
    onPick: (val, inp) => {
      const parts = inp.value.split(',');
      parts[parts.length-1] = ' '+val;
      inp.value = parts.join(',') + ', ';
      // move cursor to end
      const len = inp.value.length; inp.setSelectionRange(len,len);
    }
  });

  // ── Build output canvas ────────────────────────────────────────────────────
  // ── Buttons ────────────────────────────────────────────────────────────────
  function updateButtons(){
    $('#btn-save').disabled = layers.length === 0;
  }

  $('#btn-delete').addEventListener('click', async ()=>{
    const name = $('#meta-name').value.trim() || 'this composition';
    if (!await Dialog.confirm(`Delete "${name}"?`, {confirmLabel:'Delete', danger:true})) return;
    try{
      const r = await fetch(`${API_URL}/delete_composition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:editingId})});
      const out = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(out.message||`Server error ${r.status}`);
    }catch(err){
      await Dialog.alert(`Could not delete: ${err.message}`,{type:'error'}); return;
    }
    location.href = '/?tab=compositions';
  });

  $('#btn-save').addEventListener('click', async ()=>{
    if (!layers.length) return;
    const name = $('#meta-name').value.trim();
    if (!name){ await Dialog.alert('Please enter a name for this composition.',{type:'warning'}); return; }

    const tagsRaw = $('#meta-tags').value.trim();
    const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];

    const composition = {
      name,
      category: $('#meta-category').value.trim() || undefined,
      direction: $('#meta-direction').value || undefined,
      tags,
      color:          colorSel1.getValue() || undefined,
      secondaryColor: colorSel2.getValue() || undefined,
      canvasWidth:  canvasW,
      canvasHeight: canvasH,
      layers: layers.map(l=>({ assetId: l.assetId, x: l.x, y: l.y })),
    };
    Object.keys(composition).forEach(k => composition[k] === undefined && delete composition[k]);

    try{
      let r;
      if (editingId){
        composition.id = editingId;
        r = await fetch(`${API_URL}/update_composition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({composition})});
      } else {
        composition.dateAdded = new Date().toISOString();
        r = await fetch(`${API_URL}/append_composition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({composition})});
      }
      const out = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(out.message || `Server error ${r.status}`);
    }catch(err){
      await Dialog.alert(`Could not save composition: ${err.message}`,{type:'error'});
      return;
    }

    if (editingId){
      await Dialog.alert(`"${name}" updated.`,{type:'success'});
      location.href = '/?tab=compositions';
    } else {
      await Dialog.alert(`Composition "${name}" saved.`,{type:'success'});
      ['#meta-name','#meta-category','#meta-tags'].forEach(s=>$(s).value='');
      $('#meta-direction').value='';
      colorSel1.reset(); colorSel2.reset();
      layers=[]; selectedId=null; refreshLayerPanel(); render(); updateButtons();
    }
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  applySize();
  render();
  loadCollection();
</script>
</body>
</html>
