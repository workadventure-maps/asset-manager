<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assets Collection</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="topbar.css">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Toasts de notification */
    #notifications{
      position:fixed; top:78px; right:20px; z-index:9999;
      display:flex; flex-direction:column; gap:10px; pointer-events:none;
    }
    .toast{
      min-width:240px; max-width:360px; background:#fff; color:#1f2430;
      border:1px solid #e5e8f0; border-left:4px solid #4f46e5;
      border-radius:12px; box-shadow:0 12px 32px rgba(16,24,40,.16);
      padding:11px 14px; font-size:.88rem; line-height:1.35;
      display:flex; flex-direction:column; gap:2px; opacity:0; transform:translateY(-8px);
      animation:toast-in .2s ease-out forwards;
      pointer-events:auto; cursor:pointer;
    }
    .toast .title{ font-weight:700; }
    .toast .meta{ color:#6b7280; }
    .toast.success{ border-left-color:#16a34a; }
    .toast.success .title{ color:#16a34a; }
    .toast.info{ border-left-color:#4f46e5; }
    .toast.info .title{ color:#4f46e5; }
    .toast.warn{ border-left-color:#dc2626; }
    .toast.warn .title{ color:#dc2626; }
    @keyframes toast-in { to { opacity:1; transform:translateY(0) } }
    @keyframes toast-out { to { opacity:0; transform:translateY(-8px) } }
  </style>
</head>
<body>

<header id="topbar" class="app-topbar">
    <div class="topbar-left">
      <h1 id="main-title" class="app-title">100 Roads</h1>
      <nav class="app-nav">
        <a href="/" class="nav-link" aria-current="page">Index</a>
        <a href="/collections" class="nav-link">Collections</a>
        <a href="/add-assets" class="nav-link">Add Assets</a>
        <a href="/compose" class="nav-link">Compose</a>
        <a href="/align" class="nav-link">Sprite</a>
        <a href="/collisions" class="nav-link">Collisions</a>
      </nav>
    </div>
    <div class="topbar-right">
      <label class="menu-switch" title="Use processed dir (dist32)">
        <input id="menu-use-processed" type="checkbox">
        <span>Use processed dir (dist32)</span>
      </label>
      <button id="check-duplicates-btn" class="menu-btn" type="button" title="Show only duplicate assets (same name + direction + color)">Check duplicates</button>
      <button id="menu-resize-btn" class="menu-btn" type="button" title="Resize to 32px Grid → dist32">Resize to 32px Grid → dist32</button>
    </div>
  </header>
  
  <!-- Loader -->
  <div id="loader" role="status" aria-live="polite">
    <div id="loader-text">Loading…</div>
    <div class="progress"><div class="progress-bar"></div></div>
  </div>

  <!-- Notifications (toasts) -->
  <div id="notifications" aria-live="polite" aria-atomic="false"></div>

  <form id="metadata-form" class="compact">
    <div class="meta-field">
      <label for="collection-name">Collection</label>
      <input type="text" id="collection-name" placeholder="Collection name"/>
    </div>
    <div class="meta-field grow">
      <label for="global-tags-input">Global Tags</label>
      <div class="simple-tags" id="global-tags-simple">
        <input type="text" id="global-tags-input" placeholder="Add a tag…" aria-label="Add global tag"/>
      </div>
    </div>
  </form>

  <div class="section-header"><h2>Filters</h2></div>
  <div id="filters">
    <div class="form-group">
      <label for="filter-name">Name</label>
      <input type="text" id="filter-name" placeholder="Search by name…"/>
    </div>
    <div class="form-group">
      <label for="filter-tags">Tags <span id="tags-count" class="badge"></span></label>
      <div class="custom-tags-select" id="filter-tags-select">
        <div class="tags-input-container" id="filter-tags-container" data-component="tags-input" data-role="filter">
          <input type="text" id="filter-tags-input" placeholder="All Tags…" aria-label="Filter by tags"/>
          <div class="tags-list-container" id="filter-tags-list" role="listbox" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label for="filter-direction">Direction <span id="direction-count" class="badge"></span></label>
      <select id="filter-direction" aria-label="Filter by direction"></select>
    </div>
    <div class="form-group">
      <label for="filter-color">Color <span id="color-count" class="badge"></span></label>
      <div class="custom-color-select" id="filter-color-select" data-component="color-select" aria-haspopup="listbox" aria-expanded="false">
        <div class="selected-color-display" tabindex="0" aria-label="Filter by color, toggle list">
          <div class="color-swatch" id="filter-color-swatch"></div>
          <span class="color-name" id="filter-color-name">All Colors</span>
          <span class="color-hex" id="filter-color-hex"></span>
          <div class="dropdown-arrow"></div>
        </div>
        <div class="color-options-list" id="filter-color-options" role="listbox" aria-hidden="true"></div>
      </div>
    </div>
  </div>


    <div class="section-header"><h2>Assets <span id="assets-count-title"></span></h2></div>
  <div id="container" aria-live="polite"></div>

  <div id="fixed-buttons-container" role="toolbar" aria-label="Selection actions">
    <button id="select-all-btn" aria-label="Select all visible assets">Select All</button>
    <button id="deselect-btn" style="display:none" aria-label="Deselect all selected assets">Deselect All</button>
    <button id="validate-btn" style="display:none" aria-label="Validate selected assets">Validate Selection (<span id="selected-count">0</span>)</button>
    <button id="bulk-edit-btn" style="display:none" aria-label="Bulk edit selected assets">Bulk Edit</button>
    <button id="delete-btn" style="display:none" aria-label="Delete selected assets from JSON">Delete (<span id="delete-count">0</span>)</button>
  </div>

  <!-- Bulk Edit Modal -->
  <div id="bulkEditModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="bulkEditTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="bulkEditTitle">Edit 0 Assets</h2>
        <span class="close-btn" role="button" aria-label="Close modal" tabindex="0">&times;</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="modal-name">Name</label>
          <input type="text" id="modal-name" placeholder="Leave unchanged"/>
        </div>
        <div class="form-group tags-container">
          <label for="modal-tags-input">Tags</label>
          <div class="tags-input-container" id="modal-tags-container" data-component="tags-input" data-role="modal">
            <input type="text" id="modal-tags-input" placeholder="Add tags…" aria-label="Bulk tags"/>
            <div class="tags-list-container" id="modal-tags-list" role="listbox" aria-hidden="true"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="modal-direction">Direction</label>
          <select id="modal-direction">
            <option value="">Leave unchanged</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modal-color-select">Color</label>
          <div class="custom-color-select" id="modal-color-select" data-component="color-select" aria-haspopup="listbox" aria-expanded="false">
            <div class="selected-color-display" tabindex="0" aria-label="Bulk color, toggle list">
              <div class="color-swatch" id="modal-color-swatch" style="background:transparent"></div>
              <span class="color-name" id="modal-color-name">Leave unchanged</span>
              <span class="color-hex" id="modal-color-hex"></span>
              <div class="dropdown-arrow"></div>
            </div>
            <div class="color-options-list" id="modal-color-options" role="listbox" aria-hidden="true"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="close-modal-btn">Cancel</button>
        <button id="save-bulk-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="dialog.js"></script>
  <script src="app.js"></script>
</body>
</html>#
